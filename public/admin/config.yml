local_backend: true

backend:
  name: github
  repo: thamswork/tnc-18-project
  branch: main
  base_url: https://tnc-18-auth.tyme-sak.workers.dev

media_folder: "public/uploads"
public_folder: "/uploads"

# Cloudinary: every image field opens the TNC18 media library (folders included)
media_library:
  name: cloudinary
  output_filename_only: false
  use_transformations: true
  config:
    cloud_name: dynjnftnu
    api_key: "712915351497695"
    default_transformations:
      - - fetch_format: auto
          quality: auto
          width: 2000
          crop: limit

# Clean, ASCII-only file names for new entries (no long dashes or Thai characters in URLs)
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:

  # ═════════════════════════════════════════════
  #  1. HOMEPAGE
  # ═════════════════════════════════════════════
  - name: homepage
    label: "Homepage"
    description: "Order of projects in the Works section, plus hero, statement and pillars."
    delete: false
    editor: { preview: true }
    files:

      - name: works_order
        label: "Works — Project Order"
        file: src/data/works-order.json
        fields:
          - label: "Order on homepage (top = first)"
            name: projects
            widget: list
            required: false
            collapsed: true
            label_singular: "project"
            summary: "{{fields.project}}"
            hint: >-
              Drag the ═ handle on a row to move it. The top row appears first in Works.
              Projects not listed still appear after these. Hidden projects never show.
              If you rename a project, remove it here and add it again.
            fields:
              - label: "Project"
                name: project
                widget: relation
                collection: projects
                value_field: title
                search_fields: [title, client, location]
                display_fields: ["{{title}} ({{year}})"]
                options_length: 200

      - name: homepage_content
        label: "Homepage Content"
        file: src/content/pages/homepage.json
        fields:
          - label: "Hero Slideshow"
            name: hero_slides
            widget: list
            required: false
            collapsed: true
            label_singular: "slide"
            summary: "{{fields.image}}"
            hint: "3–6 slides. Drag the ═ handle to reorder. Mobile image is optional; if empty, the desktop image is used on phones."
            fields:
              - { label: "Desktop image (landscape, 1920×1080)", name: image, widget: image }
              - { label: "Mobile image (portrait, 1080×1920)", name: image_mobile, widget: image, required: false,
                  hint: "Shown on phones (screens up to 600px wide)." }
              - label: "Desktop crop position"
                name: position
                widget: select
                required: false
                default: "center center"
                hint: "Which part of the photo stays visible on desktop when it is cropped to fit."
                options:
                  - { label: "Center", value: "center center" }
                  - { label: "Top", value: "center top" }
                  - { label: "Bottom", value: "center bottom" }
                  - { label: "Left", value: "left center" }
                  - { label: "Right", value: "right center" }
                  - { label: "Top left", value: "left top" }
                  - { label: "Top right", value: "right top" }
                  - { label: "Bottom left", value: "left bottom" }
                  - { label: "Bottom right", value: "right bottom" }
              - label: "Mobile crop position"
                name: position_mobile
                widget: select
                required: false
                default: "center center"
                hint: "Which part stays visible on phones. Leave on Center unless the subject gets cut off."
                options:
                  - { label: "Center", value: "center center" }
                  - { label: "Top", value: "center top" }
                  - { label: "Bottom", value: "center bottom" }
                  - { label: "Left", value: "left center" }
                  - { label: "Right", value: "right center" }
                  - { label: "Top left", value: "left top" }
                  - { label: "Top right", value: "right top" }
                  - { label: "Bottom left", value: "left bottom" }
                  - { label: "Bottom right", value: "right bottom" }
          - label: "Hero Header Image (single)"
            name: hero_image
            widget: image
            required: false
            hint: "Used only if there are no slideshow images."
          - label: "Hero Header Image — Mobile"
            name: hero_image_mobile
            widget: image
            required: false
            hint: "Optional portrait version for phones (1080×1920)."
          - label: "Hero Header Image — Desktop crop position"
            name: hero_position
            widget: select
            required: false
            default: "center center"
            hint: "Which part of the photo stays visible on desktop when it is cropped to fit."
            options:
              - { label: "Center", value: "center center" }
              - { label: "Top", value: "center top" }
              - { label: "Bottom", value: "center bottom" }
              - { label: "Left", value: "left center" }
              - { label: "Right", value: "right center" }
              - { label: "Top left", value: "left top" }
              - { label: "Top right", value: "right top" }
              - { label: "Bottom left", value: "left bottom" }
              - { label: "Bottom right", value: "right bottom" }
          - label: "Hero Header Image — Mobile crop position"
            name: hero_position_mobile
            widget: select
            required: false
            default: "center center"
            hint: "Which part stays visible on phones. Leave on Center unless the subject gets cut off."
            options:
              - { label: "Center", value: "center center" }
              - { label: "Top", value: "center top" }
              - { label: "Bottom", value: "center bottom" }
              - { label: "Left", value: "left center" }
              - { label: "Right", value: "right center" }
              - { label: "Top left", value: "left top" }
              - { label: "Top right", value: "right top" }
              - { label: "Bottom left", value: "left bottom" }
              - { label: "Bottom right", value: "right bottom" }
          - { label: "Hero Video URL (.mp4)", name: hero_video, widget: string, required: false }
          - { label: "Hero headline — line 1", name: hero_line1, widget: string, required: false, hint: "Big words on the hero photo, first line, e.g. We build. Shown in capitals." }
          - { label: "Hero headline — line 2", name: hero_line2, widget: string, required: false, hint: "Second line, e.g. what works. Leave both lines empty to use the default." }
          - { label: "Hero small line (above the headline)", name: hero_sub, widget: string, required: false, hint: "Small spaced text above the headline, e.g. Bangkok · Thailand" }
          - { label: "Studio intro", name: intro, widget: text, required: false, hint: "The paragraph under The studio on the homepage. The first sentence shows bright, the rest greyer. Leave empty to use the default text." }
          - label: "Showcase projects (big slideshow near the bottom)"
            name: showcase
            widget: list
            required: false
            collapsed: true
            label_singular: "project"
            summary: "{{fields.project}}"
            hint: >-
              Pick up to 8 projects for the full-width slideshow at the bottom of the homepage.
              Drag the handle to reorder. Leave empty to let the site choose.
            fields:
              - label: "Project"
                name: project
                widget: relation
                collection: projects
                value_field: title
                search_fields: [title, client, location]
                display_fields: ["{{title}} ({{year}})"]
                options_length: 200
          - { label: "Statement / Tagline",   name: statement,  widget: text }
          - label: "Statement Background Image"
            name: statement_image
            widget: image
            required: false
          - { label: "About Headline",        name: about_headline, widget: string }
          - { label: "About Body",            name: about_body,     widget: text }
          - label: "Pillars (01 / 02 / 03)"
            name: pillars
            widget: list
            required: false
            hint: "Drag to reorder."
            summary: "{{fields.number}} — {{fields.title}}"
            fields:
              - { label: "Number", name: number, widget: string, hint: "e.g. 01" }
              - { label: "Title",  name: title,  widget: string }
              - { label: "Body",   name: body,   widget: text }

  # ═════════════════════════════════════════════
  #  2. PORTFOLIO
  # ═════════════════════════════════════════════
  - name: projects
    label: "Portfolio"
    label_singular: "Project"
    description: "All projects. To change their order on the homepage, use Homepage → Works — Project Order."
    folder: src/content/projects
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}} · {{year}}"
    sortable_fields: [order, year, title]
    view_groups:
      - { label: "Category", field: category }
      - { label: "Year",     field: year }
    view_filters:
      - { label: "Hidden from site", field: draft, pattern: true }
      - { label: "Video projects",   field: media_type, pattern: "video" }
    fields:
      - { label: "Project Title",          name: title,       widget: string }
      - { label: "Year",                   name: year,        widget: number, value_type: int }
      - label: "Category"
        name: category
        widget: select
        options: [Residential, Commercial, Interior, Mixed-Use, Hospitality, Retail, Pop-up, Exhibition & Event]
      - { label: "Client",                 name: client,      widget: string,  required: false }
      - { label: "Location / Mall",        name: location,    widget: string,  required: false,
          hint: "e.g. Siam Paragon — shown on the portfolio card" }
      - { label: "Size (e.g. 120 SQ.M)",  name: size,        widget: string,  required: false }
      - { label: "Cover Image",            name: cover,       widget: image,
          hint: "Pick from TNC18 › PROJECT UPLOADS › this project. Min 1920x1080px." }
      - label: "Media Type"
        name: media_type
        widget: select
        options: [photo, video]
        default: photo
        required: false
      - { label: "Hero Video URL",         name: video_url,   widget: string,  required: false,
          hint: "Paste a direct .mp4 URL (Cloudinary). Leave blank to use Cover Image." }
      - label: "Gallery Images"
        name: gallery
        widget: image
        required: false
        media_library:
          config:
            multiple: true
        hint: >-
          Click Choose images, open TNC18 › PROJECT UPLOADS › this project's folder,
          click the first photo then Shift+click the last, and Insert.
          Photos show in the order selected. To change the set, choose again.
      - { label: "Short Description",      name: description, widget: text,    required: false }
      - { label: "Featured on Homepage",   name: featured,    widget: boolean, default: false }
      - label: "Sort Order (1 = first)"
        name: order
        widget: number
        value_type: int
        required: false
        hint: "Fallback order. The homepage follows Homepage → Works — Project Order first."
      - label: "Hide from Site"
        name: draft
        widget: boolean
        default: false
        hint: "Turn ON to hide without deleting"
      - { label: "Full Project Description", name: body,      widget: markdown, required: false }

  # ═════════════════════════════════════════════
  #  3. NEWS & ARTICLES
  # ═════════════════════════════════════════════
  - name: specbook
    label: "News & Articles"
    label_singular: "Article"
    description: "The homepage shows the 6 newest English articles."
    folder: src/content/specbook
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}} · {{lang}}"
    sortable_fields: [date, title]
    view_groups:
      - { label: "Year",     field: date, pattern: '\d{4}' }
      - { label: "Category", field: category }
    view_filters:
      - { label: "English",          field: lang,  pattern: "en" }
      - { label: "Thai",             field: lang,  pattern: "th" }
      - { label: "Hidden from site", field: draft, pattern: true }
    fields:
      - { label: "Title",                  name: title,    widget: string }
      - { label: "Publish Date",           name: date,     widget: datetime, format: "YYYY-MM-DD" }
      - label: "Category"
        name: category
        widget: select
        options: [Retail Design, Interior Design, Pop-up Store, Exhibition, Insight, News, Project Reveal]
        required: false
      - label: "Language"
        name: lang
        widget: select
        options:
          - { label: "English", value: "en" }
          - { label: "Thai", value: "th" }
        default: "en"
        required: false
      - { label: "Cover Image",            name: cover,    widget: image,    required: false,
          hint: "Recommended: 1200x630px" }
      - { label: "Excerpt / Summary",      name: excerpt,  widget: text,     required: false,
          hint: "Shown on news cards and in Google search results" }
      - { label: "Author",                 name: author,   widget: string,   required: false,
          default: "TNC Build Studio" }
      - { label: "Article Body",           name: body,     widget: markdown, required: false,
          hint: "Write your article here. Supports headings, bold, links, lists, tables." }
      - { label: "SEO Title",              name: seo_title, widget: string,  required: false,
          hint: "Leave blank to use article title. Max 60 characters." }
      - { label: "SEO Description",        name: seo_description, widget: text, required: false,
          hint: "Leave blank to use excerpt. Max 160 characters." }
      - { label: "Tags",                   name: tags,     widget: list,     required: false,
          hint: "e.g. Bangkok, Retail, Pop-up" }
      - { label: "Featured on Homepage",   name: featured, widget: boolean,  default: false }
      - { label: "Hide from Site",         name: draft,    widget: boolean,  default: false,
          hint: "Turn ON to hide without deleting" }

  # ═════════════════════════════════════════════
  #  4. TRUSTED BY
  # ═════════════════════════════════════════════
  - name: trusted_by
    label: "Trusted By — Logos"
    label_singular: "Brand Logo"
    description: "Client and partner logos shown under the hero."
    folder: src/content/trusted-by
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    fields:
      - { label: "Brand Name",  name: name, widget: string }
      - { label: "Logo Image",  name: logo, widget: image,
          hint: "PNG or SVG, 400x120px, transparent background, dark color" }
      - { label: "Website URL", name: url,  widget: string, required: false }

  - name: trusted_by_settings
    label: "Trusted By — Heading"
    description: "The heading above the logo strip."
    delete: false
    editor: { preview: false }
    files:
      - name: trusted_by_label
        label: "Section Heading"
        file: src/content/trusted-by/settings.json
        fields:
          - { label: "Section Heading", name: section_label, widget: string,
              default: "Trusted By",
              hint: "e.g. Our Clients, Partners, Trusted By" }

  # ═════════════════════════════════════════════
  #  5. OTHER PAGES
  # ═════════════════════════════════════════════
  - name: pages
    label: "Other Pages"
    description: "About & Services and Contact page content."
    delete: false
    editor: { preview: false }
    files:

      - name: about_services
        label: "Studio Page"
        file: src/content/pages/about-services.json
        fields:
          - { label: "Main photo (full width)", name: hero_image, widget: image, required: false, hint: "Wide photo under the STUDIO title. Leave empty to use a project photo." }
          - { label: "Founding year", name: founded, widget: string, required: false, hint: "e.g. 2006. Shows as: Design and build in Bangkok since 2006. Also sets the Years number automatically." }
          - { label: "Statement", name: statement, widget: text, hint: "The big sentence under the photo. One or two sentences." }
          - { label: "Projects", name: projects, widget: string, required: false, hint: "e.g. 200+. Leave empty to hide." }
          - { label: "Photo left (portrait)", name: photo_2, widget: image, required: false, hint: "Optional. Shown first in the slideshow near the bottom; project photos rotate after it." }
          - { label: "Photo right (portrait)", name: photo_3, widget: image, required: false, hint: "Optional. Shown first in the slideshow near the bottom; project photos rotate after it." }

      - name: contact_page
        label: "Contact Page"
        file: src/content/pages/contact.json
        fields:
          - { label: "Intro line", name: intro, widget: text, required: false, hint: "Grey line next to the CONTACT title." }
          - { label: "Photo", name: hero_image, widget: image, required: false, hint: "Optional. Tall photo on the left. Leave empty to use the Curated and Co. project photo." }

  # ═════════════════════════════════════════════
  #  6. SITE SETTINGS
  # ═════════════════════════════════════════════
  - name: settings
    label: "Site Settings"
    description: "Contact details, social links, SEO and documents."
    delete: false
    editor: { preview: false }
    files:

      - name: contact
        label: "Contact & Social Links"
        file: src/content/settings/contact.json
        fields:
          - { label: "Main phone", name: phone, widget: string, required: false, hint: "Used by the Call buttons everywhere. Numbers only, e.g. 0800064465. The site adds the spaces." }
          - { label: "Office phone", name: office_phone, widget: string, required: false, hint: "Shown as Office under the main phone. e.g. 0613561422" }
          - { label: "Company name", name: company_name, widget: string, required: false, hint: "Registered name, exactly as on the company certificate. Shown in the footer copyright line and on the Studio page." }
          - { label: "Email", name: email, widget: string, required: false, hint: "e.g. info@tncbuildstudio.com" }
          - { label: "Opening hours", name: hours, widget: string, required: false, hint: "One line, e.g. Mon–Sat, 09:00–18:00" }
          - { label: "LINE link", name: line, widget: string, required: false, hint: "Full link for the Chat on LINE buttons, e.g. https://lin.ee/RdpRHTR" }
          - { label: "LINE ID", name: line_id, widget: string, required: false, hint: "Shown as text, e.g. @tncbuildstudio" }
          - { label: "Studio address", name: studio_address, widget: text, required: false, hint: "One line per row, exactly as it should appear on the site (Contact page and footer)." }
          - { label: "Footer city line", name: address, widget: string, required: false, hint: "Short text at the bottom right of every page, e.g. Bangkok, Thailand" }
          - { label: "Instagram link", name: instagram, widget: string, required: false, hint: "Full link. Leave empty to hide it." }
          - { label: "TikTok link", name: tiktok, widget: string, required: false, hint: "Full link. Leave empty to hide it." }
          - { label: "Facebook link", name: facebook, widget: string, required: false, hint: "Full link. Leave empty to hide it." }

      - name: siteinfo
        label: "Site Info & SEO"
        file: src/content/settings/siteinfo.json
        fields:
          - { label: "Site Name",           name: site_name, widget: string }
          - { label: "Tagline",             name: tagline,   widget: string }
          - { label: "Meta Description",    name: meta_desc, widget: text }
          - { label: "Google Analytics ID", name: ga_id,     widget: string, required: false,
              hint: "e.g. G-XXXXXXXXXX" }

      - name: documents
        label: "Documents & PDF Links"
        file: src/content/settings/documents.json
        fields:
          - { label: "DBD Registration Document", name: dbd_pdf, widget: image, required: false,
              hint: "Upload a PDF or image of your DBD registration document" }
